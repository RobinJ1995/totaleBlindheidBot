name: tbb-migration-test

# Integration test for the once-off S3 -> MariaDB migration and the steam-user
# database storage backend. Brings up a throwaway MariaDB + S3 (rustfs), then runs
# scripts/migration-test.ts which seeds representative legacy blobs, runs the real
# migration script, and asserts the resulting database contents.
#
#   docker compose -f acceptance/migration/docker-compose.yml up \
#       --build --abort-on-container-exit --exit-code-from migration-test

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: migtest
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:latest
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin

  migration-test:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["npx", "ts-node", "scripts/migration-test.ts"]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: migtest
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_REGION: us-east-1
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: rootpass
      MARIADB_DATABASE: migtest
      STEAM_STORAGE_BACKEND: database
    depends_on:
      mariadb:
        condition: service_healthy
      rustfs:
        condition: service_started
