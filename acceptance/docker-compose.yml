name: tbb-acceptance

services:
  mariadb:
    image: mariadb:11
    stop_grace_period: 1s
    # State is thrown away each run, so nothing a test writes is worth an fsync, and on a slow
    # disk every commit waits for one.
    tmpfs:
      - /var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: totaleblindheidbot
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  telegram-mock:
    build:
      context: ./telegram_mock
    stop_grace_period: 1s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/test/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  github-mock:
    build:
      context: ./github_mock
    stop_grace_period: 1s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/test/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  discord-mock:
    build:
      context: ./discord_mock
    stop_grace_period: 1s
    environment:
      DISCORD_MOCK_GATEWAY_URL: ws://discord-mock:8084
      DISCORD_APPLICATION_ID: "990000000000000000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/test/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    stop_grace_period: 1s
    # Swap the real steam-user package for the acceptance fake at runtime.
    volumes:
      - ./steam_mock:/app/node_modules/steam-user:ro
    environment:
      TELEGRAM_BOT_API_TOKEN: test-token
      TELEGRAM_API_BASE_URL: http://telegram-mock:8081
      # Application data and the steam-user session both live in MariaDB.
      STEAM_STORAGE_BACKEND: database
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: rootpass
      MARIADB_DATABASE: totaleblindheidbot
      STEAM_USERNAME: testuser
      STEAM_PASSWORD: testpass
      STEAM_ADMIN_TELEGRAM_USER_ID: "9999"
      STEAM_CONTROL_PORT: "9100"
      # Finalise idle matches (and confirm score resets) quickly so acceptance tests
      # don't wait minutes.
      MATCH_IDLE_MS: "6000"
      MATCH_SWEEP_MS: "1000"
      MATCH_RESET_CONFIRM_MS: "2000"
      # Strip presence markers from messages past their live window without waiting a minute.
      TAGGED_MESSAGE_SWEEP_MS: "1000"
      # Fire due scheduled rollcalls without waiting half a minute.
      SCHEDULE_CHECK_MS: "1000"
      GITHUB_API_BASE_URL: http://github-mock:8082
      GITHUB_REPO: acceptance/repo
      GITHUB_POLL_INTERVAL_MS: "1000"
      # The Discord side talks to the fake Discord (REST + gateway) instead of discord.com.
      DISCORD_BOT_TOKEN: test-discord-token
      DISCORD_APPLICATION_ID: "990000000000000000"
      DISCORD_API_BASE_URL: http://discord-mock:8083/api
      DISCORD_CDN_BASE_URL: http://discord-mock:8083/cdn
    depends_on:
      telegram-mock:
        condition: service_healthy
      github-mock:
        condition: service_healthy
      discord-mock:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9100/steam/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  behave:
    build:
      context: .
      dockerfile: Dockerfile.behave
    stop_grace_period: 1s
    environment:
      TELEGRAM_MOCK_URL: http://telegram-mock:8081
      STEAM_CONTROL_URL: http://bot:9100
      GITHUB_MOCK_URL: http://github-mock:8082
      DISCORD_MOCK_URL: http://discord-mock:8083
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: rootpass
      MARIADB_DATABASE: totaleblindheidbot
    depends_on:
      telegram-mock:
        condition: service_healthy
      github-mock:
        condition: service_healthy
      discord-mock:
        condition: service_healthy
      bot:
        condition: service_healthy
      mariadb:
        condition: service_healthy
