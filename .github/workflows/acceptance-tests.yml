name: Acceptance tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  acceptance-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_INDEX: ${{ strategy.job-index }}
      SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - name: Run acceptance tests
        working-directory: acceptance
        run: docker compose up --build --abort-on-container-exit --exit-code-from behave
      - name: Dump container logs on failure
        if: ${{ failure() }}
        working-directory: acceptance
        run: docker compose logs

  # A single check for branch protection to require, whatever the shard count.
  acceptance-test:
    if: ${{ always() }}
    needs: acceptance-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.acceptance-shard.result }}" = "success"
